<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Builder - Upload</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 820px;
    margin: 20px auto;
    padding: 15px;
    background: #f5f7fa;
}

h1 { color: #2ec4b6; text-align: center; }

.container {
    border: 2px dashed #2ec4b6;
    padding: 25px;
    text-align: center;
    background: white;
    border-radius: 10px;
}

.quiz-type { margin: 15px 0; text-align: left; }

.file-group {
    margin: 10px 0;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: #fafafa;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.file-group input[type="text"] {
    flex: 1;
    min-width: 160px;
    padding: 6px;
}

.file-group input[type="file"] {
    flex: 2;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 15px;
}

#uploadBtn {
    background: #2ec4b6;
    color: white;
    margin-top: 15px;
}

#uploadBtn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.remove-btn {
    background: #c82d3f;
    color: white;
    padding: 6px 10px;
}

#addSectionBtn {
    margin: 10px 0;
    background: #3498db;
    color: white;
}

#progress {
    display: none;
    margin-top: 15px;
    color: #2ec4b6;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>📤 Upload TXT File(s)</h1>

<div class="container">

<div class="quiz-type">
<label>
<input type="radio" name="quiz_type" value="topic" checked onchange="toggleMode()"> Topic Wise
</label>
<label>
<input type="radio" name="quiz_type" value="full" onchange="toggleMode()"> Full Mock
</label>
</div>

<div id="topic-upload">
<input type="file" id="topicFile" accept=".txt">
</div>

<div id="full-upload" style="display:none;">
<div id="fileGroups"></div>
<button type="button" id="addSectionBtn">➕ Add Section</button>
</div>

<button id="uploadBtn">Upload & Parse</button>
<div id="progress">Processing...</div>

</div>

<script>
let sectionCounter = 0;

function toggleMode() {
    const type = document.querySelector('input[name="quiz_type"]:checked').value;
    document.getElementById('topic-upload').style.display = type === 'topic' ? 'block' : 'none';
    document.getElementById('full-upload').style.display = type === 'full' ? 'block' : 'none';

    if (type === 'full' && document.querySelectorAll('.file-group').length === 0) {
        addGroup();
    }
}

function addGroup() {
    const container = document.getElementById('fileGroups');
    const group = document.createElement('div');
    group.className = 'file-group';
    group.dataset.id = sectionCounter;

    group.innerHTML = `
        <input type="text" placeholder="Section Name" required>
        <input type="file" accept=".txt" required>
        <button type="button" class="remove-btn">Remove</button>
    `;

    group.querySelector('.remove-btn').onclick = () => group.remove();
    container.appendChild(group);
    sectionCounter++;
}

document.getElementById('addSectionBtn').onclick = addGroup;

document.getElementById('uploadBtn').addEventListener('click', async () => {
    const uploadBtn = document.getElementById('uploadBtn');
    const progress = document.getElementById('progress');
    const quizType = document.querySelector('input[name="quiz_type"]:checked').value;

    const formData = new FormData();
    formData.append('quiz_type', quizType);

    if (quizType === 'topic') {
        const file = document.getElementById('topicFile').files[0];
        if (!file || !file.name.endsWith('.txt')) {
            alert('Please select a valid .txt file');
            return;
        }
        formData.append('file', file);
    } else {
        const groups = document.querySelectorAll('.file-group');
        if (groups.length === 0) {
            alert('Add at least one section');
            return;
        }

        const names = new Set();
        let valid = true;
        let index = 0;

        groups.forEach(group => {
            const sectionName = group.children[0].value.trim();
            const file = group.children[1].files[0];

            if (!sectionName || !file || !file.name.endsWith('.txt')) {
                valid = false;
                return;
            }

            if (names.has(sectionName.toLowerCase())) {
                alert('Duplicate section name: ' + sectionName);
                valid = false;
                return;
            }

            names.add(sectionName.toLowerCase());
            formData.append(`section_${index}`, sectionName);
            formData.append(`file_${index}`, file);
            index++;
        });

        if (!valid) {
            alert('Check section names and files.');
            return;
        }
    }

    uploadBtn.disabled = true;
    progress.style.display = 'block';

    try {
        const res = await fetch('/upload', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.error) {
            alert(data.error);
            progress.style.display = 'none';
            uploadBtn.disabled = false;
        } else {
            window.location.href = `/preview/${data.quiz_id}`;
        }

    } catch {
        alert('Upload failed');
        progress.style.display = 'none';
        uploadBtn.disabled = false;
    }
});
</script>

</body>
</html>
