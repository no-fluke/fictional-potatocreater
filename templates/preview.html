<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview & Edit Quiz</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

<style>
body { font-family: Arial; margin:20px; background:#f5f7fa; }
.question-card { border:1px solid #ccc; padding:15px; margin-bottom:20px; border-radius:8px; background:white; }
.options-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
.image-preview img { max-width:120px; border-radius:4px; }
button { cursor:pointer; border:none; border-radius:6px; padding:6px 10px; }
</style>
</head>

<body>

<h1>✏️ Edit Quiz</h1>

<button id="addQuestionBtn">➕ Add Question</button>
<div id="questionsContainer"></div>
<button id="generateBtn">Generate Quiz</button>

<div id="cropModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;">
<div style="background:white;padding:20px;">
<img id="cropImage" style="max-width:80vw;">
<br>
<button id="cropCancel">Cancel</button>
<button id="cropSave">Crop</button>
</div>
</div>

<script>
const questions = JSON.parse('{{ questions|tojson|safe }}');
let sections = JSON.parse('{{ sections|tojson|safe }}');
const quizType = "{{ quiz_type }}";

let currentCrop = {};

function createBlankQuestion(){
    return {
        question:"",
        option_1:"",option_2:"",option_3:"",option_4:"",option_5:"",
        answer:"",
        solution_text:"",
        question_image:"",
        option_image_1:"",option_image_2:"",option_image_3:"",option_image_4:"",option_image_5:"",
        solution_image:"",
        section: sections[0] || "General"
    };
}

function renderQuestions(){
const container=document.getElementById('questionsContainer');
container.innerHTML='';

questions.forEach((q,idx)=>{
const card=document.createElement('div');
card.className='question-card';
card.innerHTML=`
<h3>Question ${idx+1}</h3>
<textarea class="q-text" data-i="${idx}">${q.question||''}</textarea>
<input type="number" class="q-answer" data-i="${idx}" value="${q.answer||''}" min="1" max="5">
<button class="deleteBtn" data-i="${idx}">Delete</button>
`;
container.appendChild(card);
});

document.querySelectorAll('.q-text').forEach(inp=>{
inp.oninput=e=>{
questions[e.target.dataset.i].question=e.target.value;
};
});

document.querySelectorAll('.q-answer').forEach(inp=>{
inp.oninput=e=>{
let v=parseInt(e.target.value);
questions[e.target.dataset.i].answer=(v>=1&&v<=5)?v:"";
};
});

document.querySelectorAll('.deleteBtn').forEach(btn=>{
btn.onclick=e=>{
if(questions.length===1){alert("Need at least 1 question");return;}
questions.splice(e.target.dataset.i,1);
renderQuestions();
};
});
}

function openCropModal(file,index,field){
if(!file.type.startsWith("image/")){alert("Invalid image");return;}
const reader=new FileReader();
reader.onload=e=>{
document.getElementById('cropImage').src=e.target.result;
currentCrop={index,field};
document.getElementById('cropModal').style.display='flex';
if(window.cropper) window.cropper.destroy();
window.cropper=new Cropper(cropImage);
};
reader.readAsDataURL(file);
}

cropCancel.onclick=()=>{
cropModal.style.display='none';
if(window.cropper) cropper.destroy();
currentCrop={};
};

cropSave.onclick=async()=>{
if(!window.cropper) return;
const canvas=cropper.getCroppedCanvas();
canvas.toBlob(async blob=>{
const fd=new FormData();
fd.append('image',blob,'img.jpg');
const res=await fetch('/upload_image',{method:'POST',body:fd});
const data=await res.json();
if(!data.base64){alert("Upload failed");return;}
questions[currentCrop.index][currentCrop.field]=data.base64;
cropModal.style.display='none';
cropper.destroy();
currentCrop={};
});
};

document.getElementById('addQuestionBtn').onclick=()=>{
questions.push(createBlankQuestion());
renderQuestions();
};

document.getElementById('generateBtn').onclick=async()=>{
const btn=document.getElementById('generateBtn');
btn.disabled=true;
await fetch('/generate',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({questions,quiz_type:quizType})
});
btn.disabled=false;
};

window.addEventListener('DOMContentLoaded',()=>{
new Sortable(document.getElementById('questionsContainer'),{
animation:150,
onEnd:(e)=>{
const m=questions.splice(e.oldIndex,1)[0];
questions.splice(e.newIndex,0,m);
renderQuestions();
}
});
});

renderQuestions();
</script>

</body>
</html>
